<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitPro Form Checker</title>
  <link rel="stylesheet" href="form-checker.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>
<body>
  <div class="form-checker-container">
    <div class="camera-card">
      <div class="camera-header">
        <span class="live-indicator" id="liveIndicator"></span>
        <span id="cameraStatus">Camera Inactive</span>
        <span id="loadingSpinner" class="spinner hidden"></span>
      </div>
      <video id="video" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
      <div class="camera-controls">
        <button id="startBtn">Start Form Check</button>
        <button id="restartBtn" disabled>Restart</button>
        <button id="stopBtn" disabled>Stop Camera</button>
        <button id="captureBtn" disabled>Capture Screenshot</button>
      </div>
    </div>
    <div class="status-panel card">
      <div class="score-row">
        <span>Posture Score:</span>
        <div class="progress-bar-bg">
          <div class="progress-bar" id="scoreBar"></div>
        </div>
        <span id="scoreValue">0%</span>
      </div>
      <div class="status-row">
        <span>Back Alignment:</span>
        <span id="backAlignment">-</span>
      </div>
      <div class="status-row">
        <span>Neck Position:</span>
        <span id="neckPosition">-</span>
      </div>
      <div class="status-row">
        <span>Status:</span>
        <span id="statusText" class="status-badge">-</span>
      </div>
      <div class="status-row">
        <span>Timer:</span>
        <span id="timer">0s</span>
      </div>
    </div>
    <div class="history-panel card">
      <h3>Analytics History</h3>
      <table id="historyTable">
        <thead>
          <tr><th>Date</th><th>Score</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <canvas id="screenshotCanvas" class="hidden"></canvas>
  </div>
  <script src="form-checker.js"></script>
</body>
</html>
